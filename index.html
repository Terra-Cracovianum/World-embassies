<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f3eee3">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<title>Ambasady i konsulaty — Warszawa · Terra Cracovianum</title>
<meta name="description" content="Wszystkie ambasady i konsulaty w Warszawie na jednej mapie. Narzędzie Terra Cracovianum, dane z OpenStreetMap.">
<link rel="preload" href="assets/fonts/fraunces-roman-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="bar">
  <div>
    <span class="kicker">Terra Cracovianum<span class="kicker-tail"> · <span data-t="kicker">Mapa dyplomatyczna</span></span></span>
    <h1><span data-t="title">Ambasady i konsulaty</span> — <em data-city>Warszawa</em></h1>
  </div>
  <div class="bar-right">
    <span class="count" id="count" aria-live="polite"></span>
    <div class="lang" role="group" aria-label="Język / Language">
      <button data-lang="pl" aria-pressed="true">PL</button>
      <button data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
</header>

<main class="atlas">
  <div class="panel">
    <div class="panel-tools">
      <label class="search">
        <span class="visually-hidden" data-t="search">Szukaj kraju lub ulicy</span>
        <input id="q" type="search" autocomplete="off" spellcheck="false" data-t-placeholder="search" placeholder="Szukaj kraju lub ulicy">
      </label>
      <div class="filters" role="group" data-t-label="show" aria-label="Pokaż">
        <button class="filter" data-group="all" aria-pressed="true" data-t="all">Wszystkie</button>
        <button class="filter" data-group="embassy" aria-pressed="false" data-t="embassies">Ambasady</button>
        <button class="filter" data-group="consulate" aria-pressed="false" data-t="consulates">Konsulaty</button>
      </div>
    </div>
    <ul class="list" id="list"></ul>
    <p class="empty" id="empty" hidden data-t="empty">Brak wyników.</p>
    <p class="source"><span data-t="source">Dane</span>: <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a> <span id="updated"></span></p>
  </div>

  <div class="map-wrap">
    <div id="map"></div>
    <div class="status" id="status"><p data-t="loading">Wczytywanie placówek…</p></div>
  </div>
</main>

<script src="assets/vendor/leaflet/leaflet.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
