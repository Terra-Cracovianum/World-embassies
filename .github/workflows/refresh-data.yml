name: Refresh mission data

# Pulls embassies and consulates from OpenStreetMap into data/<city>.json and commits the result.
# One job per city, in parallel: a slow or failing city can't hold up or sink the others, and the
# whole refresh takes about as long as the slowest city instead of the sum of all of them.
on:
  workflow_dispatch:
    inputs:
      cities:
        description: 'Only these cities, comma-separated slugs (empty: all)'
        required: false
        default: ''
  schedule:
    - cron: '17 4 * * 1' # Mondays, 04:17 UTC
  push:
    paths:
      - 'data/cities.json'
      - 'data/overrides.json'
      - 'lib/missions.mjs'
      - 'lib/countries.mjs'
      - 'tools/fetch-missions.mjs'
      - 'tools/photos.mjs'
      - '.github/workflows/refresh-data.yml'

permissions:
  contents: write

concurrency:
  group: refresh-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cities:
    runs-on: ubuntu-latest
    outputs:
      slugs: ${{ steps.list.outputs.slugs }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        env:
          ONLY: ${{ github.event.inputs.cities }}
        run: echo "slugs=$(node -e 'const only = (process.env.ONLY || "").split(",").map(s => s.trim()).filter(Boolean); console.log(JSON.stringify(require("./data/cities.json").map(c => c.slug).filter(s => !only.length || only.includes(s))))')" >> "$GITHUB_OUTPUT"

  fetch:
    needs: cities
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 16 # each job is its own runner and IP; still kind to Overpass and Wikimedia
      matrix:
        city: ${{ fromJson(needs.cities.outputs.slugs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/fetch-missions.mjs ${{ matrix.city }}
      # A city with no snapshot yet goes live as soon as it is fetched, rather than waiting for the
      # whole run: until then the page has to ask Overpass itself, which is slow. Cities that already
      # have one are saved together by the commit job, so a refresh is one commit, not 164.
      - name: Publish a new city now
        env:
          CITY: ${{ matrix.city }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git ls-files --error-unmatch "data/$CITY.json" >/dev/null 2>&1 && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add "data/$CITY.json"
          git commit -q -m "Add $CITY from OpenStreetMap"
          for attempt in 1 2 3 4 5 6 7 8; do
            git pull -q --rebase origin "$BRANCH" && git push -q origin "HEAD:$BRANCH" && exit 0
            sleep $((attempt * 5 + RANDOM % 10))
          done
          echo "::warning::could not publish $CITY early; the commit job will save it"
      - uses: actions/upload-artifact@v4
        with:
          name: city-${{ matrix.city }}
          path: data/${{ matrix.city }}.json
          retention-days: 3

  commit:
    needs: fetch
    if: ${{ !cancelled() }} # save every city that finished, even if another failed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          pattern: city-*
          path: data
          merge-multiple: true
      - run: node tools/fetch-missions.mjs --index-only
      - name: Commit changed data
        run: |
          git add data/*.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          # `generated` changes on every run; only commit when the missions themselves moved.
          if git diff --cached -U0 -- data/ | grep '^[+-] ' | grep -vq '"generated"'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh mission data from OpenStreetMap"
            # Someone may have pushed while the cities were fetched; only data/*.json is ours.
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "Only the timestamps changed; skipping commit."
          fi
